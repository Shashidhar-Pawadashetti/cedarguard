AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Data lake storage layer — FIXED: private bucket with full access blocks.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  DataRetentionDays:
    Type: Number
    Default: 90

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "acme-datalake-${Environment}"
      AccessControl: private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldData
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: !Ref DataRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Team
          Value: data-engineering
        - Key: CostCenter
          Value: CC-4200

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "acme-logs-${Environment}"
      AccessControl: private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DataLakeBucketArn:
    Value: !GetAtt DataLakeBucket.Arn
    Export:
      Name: !Sub "${Environment}-DataLakeBucketArn"
