AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VPC networking and security groups — BROKEN: DB security group open to the
  internet. This template intentionally contains a security misconfiguration
  for CedarGuard demo purposes.

Parameters:
  Environment:
    Type: String
    Default: prod

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0123456789abcdef0

Resources:
  # ── R4-SG-OPEN-INGRESS violation ───────────────────────────────────
  # SSH and PostgreSQL ports open to the entire internet (0.0.0.0/0).
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL instances
      GroupName: !Sub "acme-db-sg-${Environment}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: "0.0.0.0/0"
          Description: "PostgreSQL — WIDE OPEN (should be VPC-only)"
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: "0.0.0.0/0"
          Description: "SSH — WIDE OPEN (should be bastion-only)"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub "acme-db-sg-${Environment}"

  # This security group is fine — restricted CIDR
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for application tier
      GroupName: !Sub "acme-app-sg-${Environment}"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "10.0.0.0/16"
          Description: "HTTPS from internal VPC only"
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DatabaseSecurityGroupId:
    Value: !GetAtt DatabaseSecurityGroup.GroupId
