name: 'CedarGuard Security Scan'
description: 'Policy-as-code security guardrail engine for IaC powered by Cedar'
inputs:
  path:
    description: 'Path to IaC directory or file to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Minimum severity that fails the check (critical, high, medium)'
    required: false
    default: 'high'
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install CedarGuard
      shell: bash
      run: |
        python -m pip install -r requirements.txt
    - name: Run CedarGuard Scan
      shell: bash
      run: |
        python -m cli.main scan ${{ inputs.path }} --fail-on ${{ inputs.fail-on }}
